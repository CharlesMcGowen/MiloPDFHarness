[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "milo-pdf-loop"
version = "0.1.0"
description = "Sanitized standalone PDF extraction, quality feedback, and adaptive reprocessing service"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pdfplumber>=0.11",
  "pydantic>=2.8",
  "pymupdf>=1.24",
  "pypdf>=5",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
tables = [
  "camelot-py>=2.0,<3",
  "fonttools>=4.55",
]
layout = [
  "docling>=2.148,<3",
]
adapters = [
  "camelot-py>=2.0,<3",
  "docling>=2.148,<3",
  "fonttools>=4.55",
]
dev = [
  "detect-secrets>=1.5",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[project.scripts]
milo = "milo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]
